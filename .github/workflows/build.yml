name: Build

# Builds the QMK firmware and the Windows flasher on every push, and publishes a
# ready-to-use release (firmware + flasher for Windows and Linux) for tags v*.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QMK_FORK: https://github.com/hansemro/qmk_firmware
  QMK_COMMIT: 162faf9688df0dd3e5f625a3518dfc6d5298d648   # branch cmmkprosrgb_mbi_preview

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          python3 -m venv "$HOME/qmk-venv"
          "$HOME/qmk-venv/bin/pip" install qmk
          echo "$HOME/qmk-venv/bin" >> "$GITHUB_PATH"
      - name: Fetch QMK fork (pinned)
        run: |
          git init qmk_firmware
          cd qmk_firmware
          git remote add origin "$QMK_FORK"
          git fetch --depth 1 origin "$QMK_COMMIT"
          git checkout FETCH_HEAD
          git submodule update --init --depth 1 lib/chibios lib/chibios-contrib lib/printf
      - name: Build
        run: |
          cp -r qmk/keyboards/cm/sk620 qmk_firmware/keyboards/cm/
          cd qmk_firmware
          make cm/sk620:default
          sha256sum cm_sk620_default.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: qmk_firmware/cm_sk620_default.bin

  flasher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/flash/test_sk620_flash.py

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sk620_flash.exe
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --console --name sk620_flash tools/flash/sk620_flash.py
          dist\sk620_flash.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/sk620_flash.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, flasher-tests, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          name="sk620-qmk-${GITHUB_REF_NAME}"
          mkdir "$name"
          cp artifacts/firmware/cm_sk620_default.bin artifacts/windows-exe/sk620_flash.exe "$name/"
          cp tools/flash/sk620_flash.py tools/flash/FLASHING.txt "$name/"
          (cd "$name" && sha256sum * > SHA256SUMS)
          zip -r "$name.zip" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sk620-qmk-*.zip
            artifacts/firmware/cm_sk620_default.bin
          generate_release_notes: true
