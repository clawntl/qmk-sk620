name: Build

# Builds the QMK firmware and the Windows flasher on every push, and publishes a
# ready-to-use release (firmware + flasher for Windows and Linux) for tags v*.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-venv
      # build.sh checks out the pinned official QMK submodule, applies patches/qmk and builds
      - name: Build default keymap
        run: ./build.sh default
      - name: Build LED mapper
        run: ./build.sh ledmap
      - name: Check the VIA definition is up to date
        run: |
          python3 tools/via/gen_via_json.py
          git diff --exit-code via/
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            out/cm_sk620_default.bin
            out/cm_sk620_ledmap.bin

  flasher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/flash/test_sk620_flash.py

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the flasher on Windows (loads the Windows HID backend)
        run: |
          python tools/flash/test_sk620_flash.py
          python -c "import sys; sys.path.insert(0, 'tools/flash'); import sk620_flash as f; print('keyboard:', f.keyboard_state())"
      - name: Build sk620_flash.exe (windowed GUI)
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --windowed --name sk620_flash tools/flash/sk620_flash.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/sk620_flash.exe

  release:
    # A release is published for a pushed v* tag, or when VERSION on main names a version that
    # has no release yet (so a release needs only a commit that bumps VERSION).
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [firmware, flasher-tests, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Which version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(tr -d ' \n' < VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already released"; tag=""
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.tag != ''
        with:
          path: artifacts
      - name: Package
        if: steps.v.outputs.tag != ''
        run: |
          name="sk620-qmk-${{ steps.v.outputs.tag }}"
          mkdir "$name"
          cp artifacts/firmware/*.bin artifacts/windows-exe/sk620_flash.exe via/sk620_iso.json "$name/"
          cp tools/flash/sk620_flash.py tools/flash/FLASHING.txt "$name/"
          (cd "$name" && sha256sum * > SHA256SUMS)
          zip -r "$name.zip" "$name"
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.tag != ''
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SK620 QMK ${{ steps.v.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            sk620-qmk-*.zip
            artifacts/firmware/cm_sk620_default.bin
            artifacts/windows-exe/sk620_flash.exe
            tools/flash/sk620_flash.py
            via/sk620_iso.json
